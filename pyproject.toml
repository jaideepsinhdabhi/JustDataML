[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "JustDataML"
dynamic = ["version"]
description = "JustDataML: Simplified Machine Learning for Everyone"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Jaideepsinh Dabhi", email = "jaideep.dabhi7603@gmail.com" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pandas>=2.2.1,<3",
    "numpy>=1.26.4,<3",
    "scikit-learn>=1.4.1,<2",
    "xgboost>=2.0.3,<4",
    "joblib>=1.3",
]

[project.urls]
Homepage = "https://github.com/jaideepsinhdabhi/JustDataML"

[project.scripts]
JDML = "jdml.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pip-audit>=2.7", "bandit>=1.7"]

[tool.hatch.version]
source = "vcs"  # version comes from the git tag, e.g. v0.1.0 -> 0.1.0
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/jdml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E9", "F"]  # syntax errors and pyflakes (unused imports, undefined names)

[tool.bandit]
exclude_dirs = ["tests"]
